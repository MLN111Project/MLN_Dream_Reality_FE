# Deploy game server (WebSocket + API) — Vercel chỉ host FE
# https://render.com → New Blueprint hoặc Web Service
services:
  - type: web
    name: dream-reality-game-server
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: CLIENT_ORIGINS
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.0-flash
